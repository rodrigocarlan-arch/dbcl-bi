<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBCL · Entrar no BI</title><link rel="stylesheet" href="/login/style.css"></head><body><main><div class="brand">dbcl<span>Inteligência de gestão</span></div><h1>Acesse seu BI</h1><p>Entre com o código enviado ao seu e-mail autorizado.</p><form id="login-form"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required><div id="code-step" hidden><label for="code">Código de acesso</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" minlength="6" maxlength="10"><button id="change-email" class="link" type="button">Usar outro e-mail</button></div><button id="submit" type="submit">Receber código</button><p id="message" role="status" aria-live="polite"></p></form><small>Acesso restrito. Os dados do escritório só são carregados após a identificação.</small></main><script src="/login/login.js"></script></body></html>
